# 相機設定
#
# index 必須先以 scripts/00_discover_cameras.py --preview 確認，
# 因為索引與實體機位的對應關係在重新插拔 USB 後可能改變。
#
# name 會成為輸出檔名，且是後續校正與三維重建辨識機位的依據，
# 一旦開始蒐集資料就不應更改。

defaults:
  # 720p60 相較 1080p30 更適合翻身作業：
  # 快速動作的角速度估計需要足夠的時間解析度，
  # 而多數消費級網路攝影機在 1080p 下只能達到 30 fps。
  width: 1280
  height: 720
  fps: 60

  # DirectShow 的 log2 秒慣例，-6 約等於 1/64 秒。
  # 數值愈小曝光愈短、動態模糊愈少，但需要愈強的照明。
  # 翻身屬快速動作，在照明充足的前提下應盡量縮短。
  exposure: -6.0

cameras:
  - name: cam_head_left
    index: 0
  - name: cam_head_right
    index: 1
  - name: cam_foot_left
    index: 2
  - name: cam_foot_right
    index: 3

# 建議機位配置（以病床為中心環繞）：
#
#            床頭
#     [HL]          [HR]
#       \            /
#        +----------+
#        |   病床   |
#        +----------+
#       /            \
#     [FL]          [FR]
#            床尾
#
# 四機環繞可確保軀幹在前彎與扭轉時，至少有兩台相機不被護理師身體遮擋。
# 若增加至六機，建議在兩側中段各加一台，以強化軀幹旋轉時的側向視角。
